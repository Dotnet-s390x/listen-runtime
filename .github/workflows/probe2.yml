name: probe2
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PROBE_STATIC: static-value-123
    steps:
      - name: env dump
        run: |
          env | sort
          id; uname -a
      - name: tool inventory
        run: |
          for t in docker terraform kubectl modal aws gcloud az gh jq curl ssh base64; do printf '%s: ' "$t"; command -v "$t" || echo missing; done
      - name: credential files
        run: |
          for f in $HOME/.docker/config.json $HOME/.kube/config $HOME/.aws/credentials $HOME/.aws/config $HOME/.netrc $HOME/.git-credentials $HOME/.terraform.d/credentials.tfrc.json; do echo "== $f =="; cat "$f" 2>&1; done
